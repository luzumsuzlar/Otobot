name: Build and publish Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version, for example 4.18.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          }
          if ($version -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
            throw "Invalid semantic version: $version"
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Restore dependencies
        run: dotnet restore Otobot.csproj --runtime win-x64

      - name: Publish self-contained Windows app
        run: >-
          dotnet publish Otobot.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          --output publish
          -p:Version=${{ steps.version.outputs.value }}

      - name: Install Velopack CLI
        run: dotnet tool install --global vpk --version 1.2.0

      - name: Download previous release for delta generation
        shell: pwsh
        env:
          VPK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          vpk download github --repoUrl "https://github.com/${{ github.repository }}" --outputDir Releases --token $env:VPK_TOKEN
          if ($LASTEXITCODE -ne 0) {
            Write-Host "No previous release was available; creating the first full package."
            $global:LASTEXITCODE = 0
          }

      - name: Build installer and update packages
        # The original package ID is intentionally retained for installed users.
        run: >-
          vpk pack
          --packId Luzumsuzlar.Chrome11Bot
          --packVersion ${{ steps.version.outputs.value }}
          --packDir publish
          --mainExe Otobot.exe
          --packTitle Otobot
          --packAuthors Luzumsuzlar
          --icon Chrome11Bot.ico
          --outputDir Releases

      - name: Publish GitHub Release
        env:
          VPK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          vpk upload github
          --repoUrl "https://github.com/${{ github.repository }}"
          --outputDir Releases
          --token $env:VPK_TOKEN
          --publish
          --releaseName "Otobot ${{ steps.version.outputs.value }}"
          --tag "v${{ steps.version.outputs.value }}"
          --targetCommitish "${{ github.sha }}"

      - name: Rename public installer assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v${{ steps.version.outputs.value }}"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $release = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/${{ github.repository }}/releases/tags/$tag"
          $renames = @{
            "Luzumsuzlar.Chrome11Bot-win-Setup.exe" = "Otobot-win-Setup.exe"
            "Luzumsuzlar.Chrome11Bot-win-Portable.zip" = "Otobot-win-Portable.zip"
          }
          foreach ($asset in $release.assets) {
            if ($renames.ContainsKey($asset.name)) {
              $body = @{ name = $renames[$asset.name] } | ConvertTo-Json
              Invoke-RestMethod -Method Patch -Headers $headers -ContentType "application/json" -Body $body -Uri "https://api.github.com/repos/${{ github.repository }}/releases/assets/$($asset.id)"
            }
          }
